[project]
name = "genetic-chess-ai"
version = "0.1.0"
description = "Evolve chess evaluation heuristics with genetic algorithms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["python-chess>=1.999,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
genetic-chess-ai = "genetic_chess_ai:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
